# Backyard — packaging metadata.
# Design phase: the package layout below is the planned target (see docs/technical-report.md §12).
# Runtime dependencies are listed but commented until the source tree lands.

[project]
name = "backyard"
version = "0.0.0"
description = "Multi-human, multi-agent collaborative coding — one live shared project, an AI agent at every seat."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Madhusudhan Reddy" }]
keywords = [
    "ai",
    "agents",
    "multi-agent",
    "collaboration",
    "real-time",
    "crdt",
    "pair-programming",
    "claude",
    "mcp",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Office/Business :: Groupware",
]

# Planned runtime dependencies (uncomment as the implementation lands).
# dependencies = [
#     "fastapi",
#     "uvicorn[standard]",
#     "pycrdt",
#     "pycrdt-websocket",
#     "redis",
#     "sqlalchemy[asyncio]",
#     "alembic",
#     "anthropic",
#     "mcp",
#     "tree-sitter",
#     "gitpython",
#     "pathspec",
#     "textual",
#     "rich",
# ]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "fakeredis",
    "ruff",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/DuckClawLabs/backyard"
"White Paper" = "https://www.linkedin.com/feed/update/urn:li:activity:7471568927584567296/"
Documentation = "https://github.com/DuckClawLabs/backyard/tree/main/docs"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
