# Local development — runs Redis + Postgres alongside the app.
# Usage: docker-compose up
# The app reloads on source changes (volume mount + --reload).

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    command: uvicorn backyard.server.app:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ../src:/app/src   # live reload during development
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://backyard:backyard@postgres:5432/backyard
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: backyard
      POSTGRES_PASSWORD: backyard
      POSTGRES_DB: backyard
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backyard"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  redis_data:
